name: 'Baidu Tieba Auto Sign'

on:
  schedule:
    - cron: '5 16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tieba_sign:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout codes'
        uses: actions/checkout@v7

      - name: 'Set Python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 'Install dependencies'
        run: python -m pip install -r requirements.txt

      - name: 'Start Sign'
        run: python main.py
        env:
          BDUSS: ${{ secrets.BDUSS }}
          HOST: ${{ secrets.HOST }}
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          AUTH: ${{ secrets.AUTH }}

      - name: 'Persist failure log'
        if: ${{ always() }}
        shell: bash
        run: |
          if git diff --quiet -- run.log; then
            echo "No new failure log to persist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add run.log
          git commit -m "chore(log): record failed sign-in"
          git push origin HEAD:main
