name: 'Baidu Tieba Auto Sign'

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/.keepalive
  schedule:
    # Regular Tieba sign-in runs.
    - cron: '5 16,22 * * *'
    # Refresh repository activity once per month.
    - cron: '37 20 1 * *'
  workflow_dispatch:

jobs:
  tieba_sign:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '5 16,22 * * *' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout codes'
        uses: actions/checkout@v7

      - name: 'Set Python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: 'Install dependencies'
        run: python -m pip install --upgrade requests

      - name: 'Start Sign'
        env:
          BDUSS: ${{ secrets.BDUSS }}
          HOST: ${{ secrets.HOST }}
          FROM: ${{ secrets.FROM }}
          TO: ${{ secrets.TO }}
          AUTH: ${{ secrets.AUTH }}
        run: python main.py

  keepalive:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '37 20 1 * *' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout codes'
        uses: actions/checkout@v7

      - name: 'Refresh keepalive marker'
        shell: bash
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/.keepalive

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/.keepalive
          git commit -m "chore(keepalive): refresh repository activity"
          git push origin HEAD:main
